<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Райский уголок · Финансы</title>
<meta name="theme-color" content="#E8E4E3">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23064E2B'/%3E%3Cpath d='M30 50a18 18 0 0 1-3-35c14-3 18-4 23-10 3 5 5 10 5 20 0 14-12 25-25 25z' fill='%23CDF53A' transform='translate(-6 4) scale(.85)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E4E3;
  --card:#fff;
  --ink:#0C1A12;
  --ink2:#3C4A42;
  --muted:#7E8982;
  --line:#EDEFEC;
  --g950:#04281A;
  --g900:#04381F;
  --g800:#064E2B;
  --g700:#0A6A3A;
  --g500:#12B866;
  --g100:#E3F3EA;
  --g50:#F1F8F4;
  --lime:#CDF53A;
  --red:#E5251B;
  --chip:#EAEAEB;
  --r:26px;
  --sh:0 1px 2px rgba(10,40,25,.05),0 14px 34px -14px rgba(10,40,25,.14);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:22px;padding:22px;max-width:1720px;margin:0 auto}
.side{background:var(--card);border-radius:30px;padding:24px 18px 18px;position:sticky;top:22px;height:calc(100vh - 44px);display:flex;flex-direction:column;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px 26px}
.logo-mark{width:48px;height:48px;border-radius:15px;background:var(--g800);color:var(--lime);display:grid;place-items:center;flex:none}
.logo b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.logo small{color:var(--muted);font-size:12.5px;font-weight:600}
.nav-l{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:6px 14px 8px}
.nav{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.nav button{display:flex;align-items:center;gap:14px;height:48px;padding:0 16px;border-radius:18px;font-weight:600;font-size:15.5px;color:var(--ink2);text-align:left;transition:.18s}
.nav button:hover{background:var(--g50)}
.nav button.on{background:var(--g800);color:#fff;box-shadow:0 12px 24px -10px rgba(6,78,43,.6)}
.side-card{margin-top:auto;border-radius:24px;padding:20px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#0B5A33 0%,transparent 60%),var(--g950);position:relative;overflow:hidden}
.side-card h4{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.side-card p{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:16px;line-height:1.45}
.side-card .btn-lime{width:100%}
.side-card .big{font-size:34px;font-weight:800;line-height:1;margin-bottom:4px}

.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top h1{font-size:clamp(28px,3vw,36px);font-weight:800;letter-spacing:-.035em;line-height:1.1}
.top .date{color:var(--ink2);font-weight:500;margin-top:6px;font-size:15.5px}
.top-r{display:flex;align-items:center;gap:14px}
.user{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:999px;padding:6px 18px 6px 6px;box-shadow:var(--sh)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--g800);color:var(--lime);display:grid;place-items:center}
.user b{display:block;font-size:14px;font-weight:800;line-height:1.2}
.user small{color:var(--muted);font-size:12px;font-weight:600}

/* ---------- сегменты и чипы ---------- */
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:5px;gap:2px;box-shadow:var(--sh)}
.seg button{height:42px;padding:0 20px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--ink2);transition:.18s;white-space:nowrap}
.seg button.on{background:var(--g800);color:#fff;box-shadow:0 8px 18px -8px rgba(6,78,43,.7)}
.seg.flat{box-shadow:none;background:rgba(255,255,255,.7)}
.bar-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.range{font-weight:700;color:var(--ink2);font-size:14.5px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--lime);color:var(--g950);white-space:nowrap}
.pill.down{background:var(--red);color:#fff}
.pill.mute{background:var(--chip);color:var(--ink2)}

/* ---------- карточки ---------- */
.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--sh);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-h h3{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.card-h p{color:var(--muted);font-size:14px;font-weight:500;margin-top:3px}
.link{color:var(--g700);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.stats{grid-column:1/9;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chartcard{grid-column:1/9}
.donutcard{grid-column:9/13;grid-row:1/3}
.recent{grid-column:1/9}
.limits{grid-column:9/13}

.stat{background:var(--card);border-radius:var(--r);padding:20px 22px 22px;box-shadow:var(--sh);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:158px}
.stat::after{content:"";position:absolute;right:-6px;top:0;width:58%;height:100%;pointer-events:none;
  background-image:radial-gradient(rgba(12,26,18,.07) 1.6px,transparent 1.8px);background-size:20px 20px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.stat-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.chipic{width:46px;height:46px;border-radius:15px;background:var(--chip);display:grid;place-items:center;color:var(--ink2)}
.stat-label{margin-top:auto;padding-top:16px;color:var(--ink2);font-weight:600;font-size:14.5px;position:relative;z-index:1}
.stat-row{display:flex;align-items:flex-end;gap:12px;position:relative;z-index:1;flex-wrap:wrap}
.stat-val{font-size:clamp(26px,2.5vw,36px);font-weight:800;line-height:1.1;letter-spacing:-.035em;white-space:nowrap}
.cap{font-size:11.5px;line-height:1.25;color:var(--muted);font-weight:600;padding-bottom:5px}
.stat.hero{background:var(--g800);color:#fff}
.stat.hero::after{background-image:radial-gradient(rgba(255,255,255,.1) 1.6px,transparent 1.8px)}
.stat.hero .chipic{background:#fff;color:var(--g800)}
.stat.hero .stat-label{color:rgba(255,255,255,.78)}
.stat.hero .cap{color:rgba(255,255,255,.6)}
.stat-sub{font-size:13px;color:rgba(255,255,255,.72);font-weight:600;margin-top:8px;position:relative;z-index:1}

/* быстрые кнопки */
.quick{display:grid;gap:14px}
.qbtn{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--sh);text-align:left;transition:.18s;min-height:76px}
.qbtn:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(10,40,25,.05),0 18px 36px -14px rgba(10,40,25,.22)}
.qbtn:active{transform:scale(.98)}
.qic{width:48px;height:48px;border-radius:16px;background:var(--g100);color:var(--g700);display:grid;place-items:center;flex:none}
.qbtn.primary .qic{background:var(--g800);color:var(--lime)}
.qbtn b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.qbtn small{color:var(--muted);font-size:12.5px;font-weight:600}
.qplus{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ink2);flex:none}

/* график */
.legend{display:flex;gap:16px;align-items:center;font-size:13px;font-weight:700;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.plot{position:relative;display:grid;grid-template-columns:46px 1fr;height:300px}
.yax{display:flex;flex-direction:column-reverse;justify-content:space-between;height:calc(100% - 34px);font-size:13px;font-weight:600;color:var(--muted)}
.plot-body{position:relative}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.cols{position:absolute;inset:0 0 34px 0;display:flex;justify-content:space-around;align-items:stretch}
.col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer}
.pair{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:6px;width:100%}
.b{width:clamp(10px,38%,26px);border-radius:999px;min-height:0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.b.in{background:var(--g500)}
.b.out{background:var(--g800)}
.col .xl{height:34px;display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.col.cur .xl{color:var(--ink);font-weight:800}
.col.fut .pair{opacity:.35}
.tip{position:fixed;z-index:90;background:var(--g950);color:#fff;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;pointer-events:none;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);display:none;line-height:1.5}
.tip b{font-weight:800}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* круговая */
.glass{background:linear-gradient(165deg,#F0F5F1 0%,#CFDDD3 52%,#B6C9BB 100%)}
.donut-wrap{position:relative;width:min(100%,250px);aspect-ratio:1;margin:6px auto 22px}
.donut-wrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 18px rgba(4,56,31,.18))}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%}
.donut-c small{font-size:12.5px;color:var(--ink2);font-weight:700}
.donut-c b{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.legrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-weight:700;font-size:14.5px}
.legrow i{width:11px;height:11px;border-radius:50%;flex:none}
.legrow span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legrow span.a{color:var(--ink2);font-weight:600}

/* списки операций */
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:hover .rn{color:var(--g700)}
.rico{width:46px;height:46px;border-radius:16px;background:var(--g100);color:var(--g700);display:grid;place-items:center;flex:none}
.rico.tr{background:var(--chip);color:var(--ink2)}
.rmid{flex:1;min-width:0}
.rn{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.rs{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{font-weight:800;font-size:16px;white-space:nowrap}
.ra.in{color:var(--g500)}
.ra.tr{color:var(--ink2)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink2);margin-right:6px;vertical-align:1px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-weight:600}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* лимиты */
.lim{padding:11px 0}
.lim-h{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.lim-h .rico{width:40px;height:40px;border-radius:13px}
.lim-h b{font-size:14.5px;font-weight:700;flex:1;min-width:0}
.lim-h span{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.track{height:10px;background:var(--g100);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--g500);border-radius:999px;transition:width .6s}
.track i.over{background:var(--red)}
.track i.warn{background:var(--g800)}

/* группы дат */
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px;font-weight:800;font-size:15px}
.day-h span{color:var(--muted);font-weight:700;font-size:13.5px}
.day-h:first-child{padding-top:0}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mini{background:var(--card);border-radius:22px;padding:16px 20px;box-shadow:var(--sh)}
.mini small{color:var(--muted);font-weight:700;font-size:13px}
.mini b{display:block;font-size:clamp(20px,2vw,26px);font-weight:800;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:0 18px;height:52px;box-shadow:var(--sh);flex:1;min-width:200px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-weight:600;font-size:15px}
.search input::placeholder{color:var(--muted);font-weight:500}
.toolrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* отчёты */
.cat-row{padding:10px 0}
.cat-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.cat-h .rico{width:40px;height:40px;border-radius:13px}
.cat-h b{font-weight:700;font-size:14.5px;flex:1;min-width:0}
.cat-h .a{font-weight:800;font-size:14.5px;white-space:nowrap}
.cat-h .pill{height:24px;font-size:12px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.monthchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.monthchips::-webkit-scrollbar{display:none}
.monthchips button{height:42px;padding:0 18px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap;box-shadow:var(--sh)}
.monthchips button.on{background:var(--g800);color:#fff}

/* настройки */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field label,.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{height:54px;border-radius:18px;background:var(--g50);border:2px solid transparent;padding:0 18px;font-weight:600;font-size:16px;outline:0;width:100%;transition:.15s}
.inp:focus{border-color:var(--g500);background:#fff}
.curs{display:flex;gap:8px;flex-wrap:wrap}
.curs button{min-width:56px;height:48px;padding:0 16px;border-radius:16px;background:var(--g50);font-weight:800;font-size:17px;color:var(--ink2)}
.curs button.on{background:var(--g800);color:#fff}
.limrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.limrow .rico{width:40px;height:40px;border-radius:13px}
.limrow b{flex:1;font-weight:700;font-size:14.5px;min-width:0}
.limrow .inp{width:130px;height:46px;text-align:right;font-size:15px;border-radius:14px}
.sub-h{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.sub-h:first-child{margin-top:0}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{height:54px;border-radius:18px;background:var(--g50);font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);transition:.15s;padding:0 20px}
.btn:hover{background:var(--g100)}
.btn.red{color:var(--red);background:#FDEEEC}
.btn.red:hover{background:#FBDCD8}
.btn-dark{background:var(--g800);color:#fff;box-shadow:0 12px 24px -10px rgba(6,78,43,.6)}
.btn-dark:hover{background:var(--g900)}
.btn-lime{height:50px;border-radius:16px;background:var(--lime);color:var(--g950);font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap;transition:.15s}
.btn-lime:hover{filter:brightness(.95)}
.note{color:var(--muted);font-size:13.5px;font-weight:500;line-height:1.5;margin-top:14px}
.demo-bar{display:flex;align-items:center;gap:14px;background:var(--lime);color:var(--g950);border-radius:22px;padding:14px 18px;font-weight:700;font-size:14.5px;flex-wrap:wrap}
.demo-bar span{flex:1;min-width:200px}
.demo-bar button{height:42px;padding:0 18px;border-radius:14px;background:var(--g950);color:#fff;font-weight:800;font-size:14px}

/* ---------- нижняя панель (телефон) ---------- */
.tabbar{display:none}

/* ---------- модальное окно ---------- */
.ov{position:fixed;inset:0;background:rgba(4,40,26,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.sheet{background:#fff;border-radius:32px;width:min(900px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 40px 90px -20px rgba(0,0,0,.4);animation:rise .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:24px 28px 8px}
.sh-head h3{font-size:24px;font-weight:800;letter-spacing:-.03em}
.xbtn{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ink2)}
.sh-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:30px;padding:14px 28px 20px;overflow-y:auto}
.sh-left{display:flex;flex-direction:column;gap:14px}
.mseg{display:grid;gap:6px;background:var(--g50);border-radius:20px;padding:5px}
.mseg button{height:48px;border-radius:16px;font-weight:800;font-size:15px;color:var(--ink2);transition:.15s}
.mseg button.on{background:var(--g800);color:#fff;box-shadow:0 8px 18px -8px rgba(6,78,43,.7)}
.mseg.s2{grid-template-columns:1fr 1fr}
.mseg.s3{grid-template-columns:1fr 1fr 1fr}
.mseg.small button{height:42px;font-size:14.5px}
.amt{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:10px 0 4px;min-height:84px}
.amt span.v{font-size:clamp(46px,7vw,60px);font-weight:800;letter-spacing:-.045em;line-height:1}
.amt span.v.zero{color:#C5CCC7}
.amt span.c{font-size:28px;font-weight:700;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:20px;background:var(--g50);font-size:26px;font-weight:700;display:grid;place-items:center;transition:.1s;color:var(--ink)}
.pad button:active{background:var(--g100);transform:scale(.96)}
.pad button.del{color:var(--ink2)}
.sh-right{display:flex;flex-direction:column;gap:12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:12px 6px;border-radius:20px;background:var(--g50);border:2px solid transparent;font-weight:700;font-size:13.5px;line-height:1.2;text-align:center;color:var(--ink2);transition:.15s}
.cat .ci{width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--g700)}
.cat.on{background:var(--g800);color:#fff;box-shadow:0 12px 22px -10px rgba(6,78,43,.65)}
.cat.on .ci{background:var(--lime);color:var(--g950)}
.dates{display:flex;gap:8px;flex-wrap:wrap}
.dates button,.dates label{height:46px;padding:0 18px;border-radius:16px;background:var(--g50);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;color:var(--ink2);cursor:pointer}
.dates .on{background:var(--g800);color:#fff}
.dates input[type=date]{border:0;background:none;font-weight:700;font-size:14.5px;outline:0;color:inherit;width:128px}
.trinfo{background:var(--g50);border-radius:20px;padding:18px;color:var(--ink2);font-weight:600;font-size:14.5px;line-height:1.5;display:flex;gap:14px;align-items:flex-start}
.trinfo .qic{background:#fff}
.sh-foot{padding:16px 28px 26px;display:flex;gap:12px}
.cta{flex:1;height:62px;border-radius:21px;background:var(--g800);color:#fff;font-weight:800;font-size:18px;letter-spacing:-.01em;box-shadow:0 16px 28px -12px rgba(6,78,43,.7);transition:.15s}
.cta:hover{background:var(--g900)}
.cta:disabled{background:#D6DDD8;color:#8A958E;box-shadow:none;cursor:not-allowed}
.delbtn{width:62px;height:62px;border-radius:21px;background:#FDEEEC;color:var(--red);display:grid;place-items:center;flex:none}
.cf{background:#fff;border-radius:28px;padding:28px;width:min(420px,100%);animation:rise .25s;box-shadow:0 40px 90px -20px rgba(0,0,0,.4)}
.cf h3{font-size:21px;font-weight:800;letter-spacing:-.025em;margin-bottom:8px}
.cf p{color:var(--ink2);font-weight:500;margin-bottom:22px;line-height:1.5}
.cf .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf .row2 .btn{height:54px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);z-index:100;background:var(--g950);color:#fff;border-radius:20px;padding:14px 14px 14px 22px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:14.5px;box-shadow:0 20px 40px -12px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--lime);color:var(--g950);height:38px;padding:0 16px;border-radius:12px;font-weight:800;font-size:13.5px}


/* v2 */
.seg.scroll{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.mseg.s4{grid-template-columns:repeat(4,1fr)}
.mseg.s4 button{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:14px;background:var(--g50);font-weight:700;font-size:13.5px;color:var(--ink2);text-align:left;line-height:1.2}
.chips button.on{background:var(--g800);color:#fff}
.row{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;align-items:stretch}
.row>*{flex:1 1 320px;min-width:0}
.row>.w2{flex:2 1 560px}
.crow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .rico{width:42px;height:42px;border-radius:14px}
.crow .ra{font-size:15px}
.crow .rn,.crow .rs{white-space:normal;line-height:1.25}
.paybtn{height:36px;padding:0 12px;border-radius:12px;background:var(--g100);color:var(--g800);font-weight:800;font-size:13px;flex:none}
.paybtn.hot{background:var(--g800);color:#fff}
.tag.debt{background:#FDEEEC;color:var(--red)}
.budget{background:var(--g50);border-radius:20px;padding:14px 16px;margin-bottom:8px}
.budget small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.budget b{font-size:26px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.2}
.budget span{font-size:13px;font-weight:600;color:var(--ink2)}
.budget.bad{background:#FDEEEC}.budget.bad b{color:var(--red)}
.ringrow{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.bigsum{font-size:24px;font-weight:800;display:block;line-height:1.2}
.plan{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2)}
.plan b{color:var(--ink);font-weight:800;white-space:nowrap}
.recrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.recrow .inp{height:46px;border-radius:14px;font-size:15px}
.recline{display:flex;gap:8px;align-items:center}
.recline .inp{min-width:0;flex:1}
.inp.sel{padding:0 12px}
.qbtn.keep small{display:block}
.quick{grid-template-columns:repeat(3,1fr)}

/* ---------- адаптив ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:1fr;padding:16px 16px 120px;gap:0}
  .side{display:none}
  .user{display:none}
  .grid{display:flex;flex-direction:column;gap:16px}
  .stats{display:grid;gap:14px}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:72px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 18px 40px -14px rgba(10,40,25,.35);z-index:50;align-items:center;justify-content:space-around;padding:0 8px}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:8px 0;border-radius:18px}
  .tabbar button.on{color:var(--g800)}
  .tabbar .fab{flex:none;width:62px;height:62px;border-radius:50%;background:var(--g800);color:var(--lime);display:grid;place-items:center;margin:-26px 4px 0;box-shadow:0 16px 28px -10px rgba(6,78,43,.75);padding:0}
  .quick,.quick{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  body{font-size:14.5px}
  .top{gap:12px}
  .top-r{width:100%}
  .top-r .seg{width:100%}
  .top-r .seg button{flex:1;padding:0 8px}
  .card{padding:18px;border-radius:24px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:nth-child(1),.stats .stat:nth-child(4){grid-column:1/-1}
  .stat{min-height:132px;padding:16px 18px 18px;border-radius:24px}
  .stat-val{font-size:26px}
  .stats .stat:nth-child(1) .stat-val{font-size:34px}
  .stats .stat:nth-child(2) .stat-val,.stats .stat:nth-child(3) .stat-val{font-size:21px}
  .cap{display:none}
  .stats .stat:nth-child(1) .cap,.stats .stat:nth-child(4) .cap{display:block}
  .chipic{width:40px;height:40px;border-radius:13px}
  .quick{gap:10px}
  .qbtn{padding:12px;gap:10px;min-height:70px;border-radius:20px}
  .qic{width:42px;height:42px;border-radius:14px}
  .qbtn b{font-size:14px}
  .qbtn small{display:none}
  .qbtn.keep small{display:block}
  .row{flex-direction:column}
  .row>*,.row>.w2{flex:none;width:100%}
  .qplus{display:none}
  .plot{height:250px;grid-template-columns:36px 1fr}
  .yax{font-size:11.5px}
  .b{width:clamp(7px,34%,16px)}
  .pair{gap:3px}
  .col .xl{font-size:11.5px}
  .sumrow{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .mini{padding:12px 12px;border-radius:18px}
  .mini small{font-size:11.5px}
  .mini b{font-size:15px}
  .twocol,.set-grid{grid-template-columns:1fr}
  .seg button{padding:0 14px;height:40px;font-size:14px}
  .ov{padding:0;align-items:flex-end}
  .sheet{border-radius:30px 30px 0 0;max-height:96vh;width:100%}
  .sh-head{padding:18px 20px 4px}
  .sh-head h3{font-size:21px}
  .sh-body{grid-template-columns:1fr;gap:18px;padding:10px 20px 14px}
  .pad button{height:56px;font-size:24px;border-radius:18px}
  .amt{min-height:70px}
  .sh-foot{padding:12px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .cta{height:58px}
  .delbtn{height:58px}
  .limrow .inp{width:110px}
  .toast{bottom:104px;left:16px;right:16px;transform:translateY(30px);justify-content:space-between}
  .toast.show{transform:translateY(0)}
}
</style>
</head>

function genDemo(){
  let seed=20261108;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const R=(a,b,step=50)=>Math.round((a+rnd()*(b-a))/step)*step;
  const out=[];let k=0;const T=today();
  const add=(d,type,space,pt,cat,amt,note='',x={})=>out.push({id:'d'+(k++),date:ymd(d),type,space,pt,cat,amt,note,...x});
  const inv=(d,sup,amt,note='')=>{const df=(supOf2(sup)||0);const age=Math.round((T-d)/864e5);const unpaid=df>0&&age<df;add(d,'out','shop',0,'purchase',amt,note,{sup,paid:!unpaid,...(unpaid?{due:ymd(addDays(d,df))}:{})})};
  const DEF={sauce:14,drink:14,frozen:14};const supOf2=id=>DEF[id]||0;
  for(let i=-190;i<=0;i++){
    const d=addDays(T,i),dow=(d.getDay()+6)%7,dom=d.getDate(),mon=d.getMonth()+1,f=[.9,.85,.9,1,1.15,1.35,1.2][dow];
    if(i<0){
      add(d,'in','shop',1,'rev',Math.round(R(22000,38000)*f/50)*50);
      add(d,'in','shop',2,'rev',Math.round(R(13000,24000)*f/50)*50);
      add(d,'out','shop',rnd()<.5?1:2,'markdown',R(500,2500));
      if(rnd()<.45)add(d,'out','shop',rnd()<.5?1:2,'spoil',R(700,3200));
      add(d,'out','shop',0,'fuel',R(700,1300));
      if(dom===3)add(d,'out','shop',0,'loader',25000);
      if(dom===25)add(d,'out','shop',0,'rent',75000,'Две точки');
      if(dom===10||dom===25){add(d,'out','shop',0,'sellers',R(12000,16000,500))}
      if([1,4,7,10].includes(mon)&&dom===28)add(d,'out','shop',1,'tax',13100);
      if(dom===28)add(d,'sv','family',0,'sv',40000,'В подушку');
      if(dom===1)add(d,'out','family',0,'univ',20000);
      if(dom===4)add(d,'out','family',0,'tutor',12000);
      if(dom===8)add(d,'out','family',0,'sport',6000);
      if(dom===15){add(d,'out','family',0,'credit',2500);add(d,'out','family',0,'phone',1450,'Связь, интернет')}
      if(dom===18)add(d,'out','family',0,'house',9800,'Квартира');
      if(dow!==6)add(d,'tr','shop',0,'tr',R(5000,9000,500));
      if(rnd()<.72)add(d,'out','family',0,'food',R(900,2800));
      if(rnd()<.05)add(d,'out','family',0,'health',R(1500,5000),'Аптека');
      if(rnd()<.04)add(d,'out','family',0,'clothes',R(3000,9000,100));
      if(rnd()<.06)add(d,'out','family',0,'fun',R(2000,9000,100),'Маркетплейс');
      if(dow===5)add(d,'out','family',0,'car',3000,'Бензин');
    }
    if([0,2,4,5].includes(dow))inv(d,'veg',R(22000,34000,100),'Накладная');
    if(dow===1){inv(d,'drink',R(16000,24000,100));}
    if(dow===1&&rnd()<.5)inv(d,'dry',R(18000,28000,100));
    if(dow===2&&i%14<7)inv(d,'sauce',R(14000,20000,100));
    if(dow===3)inv(d,'ice',R(10000,15000,100));
    if(dow===3&&i%14<7)inv(d,'spice',R(6000,9000,100));
    if(dow===4)inv(d,'frozen',R(12000,18000,100));
    if(dow===5&&i%14<7)inv(d,'grain',R(9000,14000,100));
  }
  return out;
}

/* ---------- периоды и сводки ---------- */
function range(p){
  const t=today();
  if(p==='day')return[t,t];
  if(p==='week')return[addDays(t,-((t.getDay()+6)%7)),t];
  if(p==='month')return[new Date(t.getFullYear(),t.getMonth(),1),t];
  if(p==='year')return[new Date(t.getFullYear(),0,1),t];
  return[new Date(2000,0,1),t];
}
function prevRange(p){
  const [s,e]=range(p);
  if(p==='day')return[addDays(s,-1),addDays(e,-1)];
  if(p==='week')return[addDays(s,-7),addDays(e,-7)];
  if(p==='month'){const y=s.getFullYear(),m=s.getMonth()-1;const yy=m<0?y-1:y,mm=(m+12)%12;return[new Date(yy,mm,1),new Date(yy,mm,Math.min(e.getDate(),dim(yy,mm)))]}
  if(p==='year'){const y=s.getFullYear()-1;return[new Date(y,0,1),new Date(y,e.getMonth(),Math.min(e.getDate(),dim(y,e.getMonth())))]}
  return[s,e];
}
function rangeLabel(p){
  const [a,b]=range(p);
  if(p==='day')return `${b.getDate()} ${MG[b.getMonth()]}`;
  if(p==='month')return `${MN[b.getMonth()]} ${b.getFullYear()}`;
  if(p==='year')return `${b.getFullYear()} год`;
  if(p==='week')return `${a.getDate()} ${a.getMonth()===b.getMonth()?'':MG[a.getMonth()]+' '}– ${b.getDate()} ${MG[b.getMonth()]}`;
  return 'За всё время';
}
function summarize(a,b,scope){
  const r={inc:0,out:0,tr:0,saved:0,debt:0,rev:0,purchase:0,loss:0,sellers:0,n:0,cats:{},incCats:{},sup:{}};
  for(const t of S.tx){
    if(t.date<a||t.date>b)continue;
    if(t.type==='sv'||t.type==='sw'){if(scope==='all'||scope==='family'){r.saved+=t.type==='sv'?t.amt:-t.amt;r.n++}continue}
    if(t.type==='tr'){
      if(scope==='shop')r.tr+=t.amt;
      else if(scope==='family'){r.inc+=t.amt;r.incCats.tr=(r.incCats.tr||0)+t.amt;r.n++}
      continue;
    }
    if(!sc2(t,scope))continue;
    r.n++;
    if(t.type==='in'){r.inc+=t.amt;r.incCats[t.cat]=(r.incCats[t.cat]||0)+t.amt;if(t.space==='shop')r.rev+=t.amt}
    else{
      r.out+=t.amt;r.cats[t.cat]=(r.cats[t.cat]||0)+t.amt;
      if(t.cat==='purchase'){r.purchase+=t.amt;if(t.paid===false)r.debt+=t.amt;if(t.sup)r.sup[t.sup]=(r.sup[t.sup]||0)+t.amt}
      if(t.cat==='markdown'||t.cat==='spoil')r.loss+=t.amt;
      if(t.cat==='sellers')r.sellers+=t.amt;
    }
  }
  r.left=r.inc-r.out+r.debt-r.saved;
  return r;
}
const sum=(p,scope)=>{const [a,b]=range(p);return summarize(ymd(a),ymd(b),scope)};
const sumPrev=(p,scope)=>{const [a,b]=prevRange(p);return summarize(ymd(a),ymd(b),scope)};
const daysIn=p=>{const [a,b]=range(p);return Math.round((b-a)/864e5)+1};
function buckets(){
  const t=today(),p=UI.period,mon=addDays(t,-((t.getDay()+6)%7));
  if(p==='day'||p==='week')return [0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i);return{l:DS[i],a:ymd(d),b:ymd(d),fut:d>t,cur:ymd(d)===ymd(t),full:`${DS[i]}, ${d.getDate()} ${MG[d.getMonth()]}`}});
  if(p==='month')return [5,4,3,2,1,0].map(k=>{const sd=addDays(mon,-7*k),ed=addDays(sd,6);
    return{l:`${sd.getDate()} ${MS[sd.getMonth()].toLowerCase()}`,a:ymd(sd),b:ymd(ed),fut:false,cur:k===0,full:`${sd.getDate()} ${MG[sd.getMonth()]} – ${ed.getDate()} ${MG[ed.getMonth()]}`}});
  const y=t.getFullYear();
  return MS.map((l,i)=>{const sd=new Date(y,i,1);return{l,a:ymd(sd),b:ymd(new Date(y,i,dim(y,i))),fut:sd>t,cur:i===t.getMonth(),full:`${MN[i]} ${y}`}});
}
function niceMax(v){
  if(v<=0)return 4000;
  const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;
  return [1,1.2,1.6,2,2.4,3.2,4,4.8,6,8,10].find(x=>f<=x+1e-9)*e;
}

/* платежи и долги */
function recScope(r,sc){
  if(sc==='all')return true;
  if(sc==='family')return r.space==='family';
  if(r.space!=='shop')return false;
  return sc==='shop'||r.pt===0||(sc==='p1'&&r.pt===1)||(sc==='p2'&&r.pt===2);
}
function dueList(sc){
  const items=[],t=today(),y=t.getFullYear(),m=t.getMonth()+1,ym=`${y}-${pad(m)}`;
  S.tx.filter(x=>x.type==='out'&&x.cat==='purchase'&&x.paid===false&&sc2(x,sc)).forEach(x=>items.push({kind:'inv',id:x.id,n:supName(x.sup),amt:x.amt,due:x.due||null,sub:'Накладная от '+dayLabel(x.date).toLowerCase()}));
  S.rec.forEach(r=>{
    if(!recScope(r,sc)||S.rpaid[r.id+':'+ym])return;
    const on=r.per==='m'||(r.per==='q'&&r.mon!=null&&(((m-r.mon)%3)+3)%3===0)||(r.per==='y'&&r.mon!=null&&m===r.mon);
    if(!on)return;
    items.push({kind:'rec',id:r.id,n:r.n,amt:r.amt,due:r.day?`${ym}-${pad(Math.min(r.day,dim(y,m-1)))}`:null,sub:'Платёж этого месяца'});
  });
  return items.sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
}

function viewHome(){

  if(c.debt)subs.push(`В долг у поставщиков: ${money(c.debt)}`);
  if(sc==='shop'&&c.tr)subs.push(`Забрали домой: ${money(c.tr)}`);
  if(sc==='p1'||sc==='p2')subs.push('Без общих расходов (аренда и др.)');

  }else t4={icon:'target',label:'Расход в день',value:money(Math.round(c.out/days)),badge:badge(pct(c.out/days,p.out/daysIn(P)),false)};
  const cap='к прошлому<br>периоду';

    stat('hero','wallet',balLabel,money(c.left),badge(pct(c.left,p.left),true),subs.map(s=>`<div class="stat-sub">${s}</div>`).join(''))+

    stat('',t4.icon,t4.label,t4.value,t4.badge);

  /* график */
  const bk=buckets().map(b=>{const s=summarize(b.a,b.b,sc);return{...b,inc:s.inc,out:s.out}});
  const mx=niceMax(Math.max(...bk.flatMap(b=>[b.inc,b.out])));
  const ticks=[0,1,2,3,4].map(i=>mx*i/4);
  const sub=P==='month'?'Последние 6 недель':P==='year'?'По месяцам года':'По дням недели';

      <div class="legend"><span><i style="background:var(--g500)"></i>Заработано</span><span><i style="background:var(--g800)"></i>Потрачено</span></div></div>
    <div class="plot">
      <div class="yax">${ticks.map(v=>`<span>${v?short(v):'0'}</span>`).join('')}</div>
      <div class="plot-body">
        ${ticks.map((v,i)=>`<div class="gl" style="bottom:calc((100% - 34px) * ${i/4} + 34px)"></div>`).join('')}
        <div class="cols">${bk.map(b=>`<div class="col ${b.cur?'cur':''} ${b.fut?'fut':''}" data-tip="${esc(b.full)}|${b.inc}|${b.out}">
          <div class="pair"><div class="b in" style="height:${b.inc?Math.max(b.inc/mx*100,1.5):0}%"></div><div class="b out" style="height:${b.out?Math.max(b.out/mx*100,1.5):0}%"></div></div>
          <div class="xl">${b.l}</div></div>`).join('')}</div>
      </div>
    </div>
  </div>`;

  /* куда уходят деньги */
  const entries=Object.entries(c.cats).sort((a,b)=>b[1]-a[1]);
  const top=entries.slice(0,5),rest=entries.slice(5).reduce((s,[,v])=>s+v,0);
  const items=top.map(([id,v],i)=>({n:catById(id).n,v,c:SPLITS[i]}));
  if(rest>0)items.push({n:'Остальное',v:rest,c:'#8FA195'});
  const R=72,C=2*Math.PI*R;let off=0;
  const segs=items.map(it=>{const len=C*it.v/c.out,g=items.length>1?2.5:0,l=Math.max(len-g,.5);const s=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${it.c}" stroke-width="30" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len;return s}).join('');
  const donut=`
  <div class="card glass donutcard">
    <div class="card-h"><div><h3>Куда уходят деньги</h3><p>${rangeLabel(P)}</p></div></div>
    ${c.out>0?`
    <div class="donut-wrap"><svg viewBox="0 0 200 200">${segs}</svg><div class="donut-c"><small>Потрачено</small><b class="num">${money(c.out)}</b></div></div>
    <div>${items.map(it=>`<div class="legrow"><i style="background:${it.c}"></i><span class="n">${esc(it.n)}</span><span class="a num">${fmt(it.v)}</span><span class="pill">${Math.round(it.v/c.out*100)}%</span></div>`).join('')}</div>`
    :`<div class="empty"><b>Пока нет расходов</b>Запишите первую трату — и здесь появится картина.</div>`}
  </div>`;

  /* контроль магазина */
  let control='';
  if(shop||sc==='all'){
    const rev=c.rev,pr=rev?Math.round(c.purchase/rev*100):null,lr=rev?(c.loss/rev*100).toFixed(1).replace('.',','):null;
    const acc=Math.round(rev*S.sellersPct/100);
    const debtAll=S.tx.filter(t=>t.type==='out'&&t.cat==='purchase'&&t.paid===false&&sc2(t,sc)).reduce((n,t)=>n+t.amt,0);
    const row=(ic,title,val,sub)=>`<div class="crow"><span class="rico">${icon(ic,20)}</span><span class="rmid"><div class="rn">${title}</div><div class="rs">${sub}</div></span><span class="ra num">${val}</span></div>`;
    control=`<div class="card"><div class="card-h"><div><h3>Контроль магазина</h3><p>${rangeLabel(P)}</p></div></div>
      ${row('cart','Накладные (закупка)',money(c.purchase),pr==null?'нет выручки за период':`${pr}% от выручки`)}
      ${row('trend','Уценка и списания',money(c.loss),lr==null?'нет выручки за период':`${lr}% от выручки`)}
      ${row('user','Зарплата продавцов',money(acc),`${S.sellersPct}% от выручки · выплачено ${money(c.sellers)}${acc>c.sellers?' · к выплате '+money(acc-c.sellers):''}`)}
      ${row('clock','Долг поставщикам',money(debtAll),'накладные без оплаты')}
    </div>`;
  }

  /* платежи и долги */
  const dues=dueList(sc),todayS=ymd(today());
  const dueTotal=dues.reduce((n,d)=>n+d.amt,0);
  const pays=`<div class="card"><div class="card-h"><div><h3>Платежи и долги</h3><p>${dues.length?`К оплате: ${money(dueTotal)}`:'Всё оплачено'}</p></div><button class="link" data-act="nav" data-v="settings">Настроить</button></div>
    ${dues.length?dues.slice(0,6).map(d=>{
      const late=d.due&&d.due<todayS,soon=d.due&&!late&&d.due<=ymd(addDays(today(),3));
      const when=d.due?(late?'<span class="pill down" style="height:20px;font-size:11px">просрочено</span> ':'')+'до '+parse(d.due).getDate()+' '+MG[parse(d.due).getMonth()]:d.sub;
      return `<div class="crow"><span class="rico">${icon(d.kind==='inv'?'clock':'repeat',20)}</span><span class="rmid"><div class="rn">${esc(d.n)}</div><div class="rs">${when}</div></span><span class="ra num" style="margin-right:6px">${fmt(d.amt)}</span><button class="paybtn ${late||soon?'hot':''}" data-act="${d.kind==='inv'?'pay-inv':'pay-rec'}" data-id="${d.id}">Оплачено</button></div>`}).join('')
    :`<div class="empty"><b>Платежей нет</b>Здесь появятся накладные в долг и ежемесячные платежи.</div>`}
    ${dues.length>6?`<div class="note" style="text-align:center">и ещё ${dues.length-6}</div>`:''}
  </div>`;

  /* лимиты */
  const lsc=sc==='all'?'all':isShop(sc)?'shop':'family';
  const [ma,mb]=range('month'),ms=summarize(ymd(ma),ymd(mb),lsc);
  const catsIn=lsc==='all'?[...LIM_SHOP,...LIM_FAM]:lsc==='shop'?LIM_SHOP:LIM_FAM;
  const limIds=catsIn.filter(id=>S.limits[id]>0);
  const lims=limIds.map(id=>({id,lim:S.limits[id],used:ms.cats[id]||0})).sort((a,b)=>b.used/b.lim-a.used/a.lim).slice(0,6);
  const totLim=limIds.reduce((n,id)=>n+S.limits[id],0),totUsed=limIds.reduce((n,id)=>n+(ms.cats[id]||0),0);
  const t0=today(),daysLeft=dim(t0.getFullYear(),t0.getMonth())-t0.getDate()+1;
  const left=totLim-totUsed;
  const limHead=limIds.length?`<div class="budget ${left<0?'bad':''}"><small>${left<0?'Перерасход по лимитам':'Осталось по лимитам'}</small><b class="num">${money(Math.abs(left))}</b><span>${left<0?'':`≈ ${money(Math.max(0,Math.floor(left/daysLeft/10)*10))} в день до конца месяца`}</span></div>`:'';
  const limits=`
  <div class="card">
    <div class="card-h"><div><h3>Лимиты на месяц</h3><p>Чтобы траты не удивляли</p></div><button class="link" data-act="nav" data-v="settings">Задать</button></div>
    ${limHead}
    ${lims.length?lims.map(l=>{const pc=l.used/l.lim*100,cls=pc>100?'over':pc>80?'warn':'';
      return `<div class="lim"><div class="lim-h"><span class="rico">${icon(catById(l.id).i,20)}</span><b>${esc(catById(l.id).n)}</b><span class="num">${fmt(l.used)} / ${fmt(l.lim)}</span></div><div class="track"><i class="${cls}" style="width:${Math.min(pc,100)}%"></i></div></div>`}).join('')
    :`<div class="empty"><b>Лимитов пока нет</b>Задайте сумму на месяц для продуктов, досуга и других трат — приложение будет предупреждать.</div>`}
  </div>`;

  /* подушка безопасности */
  let savings='';
  if(sc==='all'||sc==='family'){
    const bal=cushionBal(),goal=S.cushion.goal,need=Math.max(0,goal-bal),per=need>0?Math.ceil(need/Math.max(1,S.cushion.months)/100)*100:0;
    const monthSaved=sum('month','family').saved,pc=Math.min(100,bal/goal*100);
    const R2=54,C2=2*Math.PI*R2;
    savings=`<div class="card savecard"><div class="card-h"><div><h3>Подушка безопасности</h3><p>Копим и не трогаем</p></div></div>
      <div class="ringrow"><div class="ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${R2}" fill="none" stroke="var(--g100)" stroke-width="16"/><circle cx="70" cy="70" r="${R2}" fill="none" stroke="var(--g800)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C2*pc/100} ${C2}" transform="rotate(-90 70 70)"/></svg><b class="num">${Math.round(pc)}%</b></div>
      <div><b class="num bigsum">${money(bal)}</b><div class="rs">из ${money(goal)}</div>${need>0?`<div class="rs" style="margin-top:6px">Осталось собрать ${money(need)}</div>`:`<div class="rs" style="margin-top:6px;color:var(--g700)">Цель достигнута</div>`}</div></div>
      ${need>0?`<div class="plan"><span>Чтобы собрать за ${S.cushion.months} мес.</span><b class="num">${money(per)} / мес</b></div><div class="plan"><span>В этом месяце отложено</span><b class="num">${money(monthSaved)}</b></div>`:''}
      <button class="btn btn-dark" style="width:100%;margin-top:14px" data-act="add" data-p="save">${icon('plus',20,2.2)}Отложить в подушку</button>
    </div>`;
  }

  /* последние записи */
  const rows=filteredTx(sc).slice(0,7);
  const recent=`
  <div class="card">
    <div class="card-h"><div><h3>Последние записи</h3><p>Нажмите на запись, чтобы исправить</p></div><button class="link" data-act="nav" data-v="ops">Все записи ${icon('up',16,2.2)}</button></div>
    ${rows.length?rows.map(t=>opRow(t)).join(''):`<div class="empty"><b>Здесь пока пусто</b>Нажмите «Выручка» или «Накладная» вверху.</div>`}
  </div>`;

  const q=(cls,ic,b,s,pr)=>`<button class="qbtn ${cls}" data-act="add" data-p="${pr}"><span class="qic">${icon(ic,24)}</span><span><b>${b}</b><small>${s}</small></span><span class="qplus">${icon('plus',18,2.2)}</span></button>`;
  const quick=`<div class="quick">
    ${q('primary keep','banknote','Выручка',esc(S.pts[0]),'rev1')}
    ${q('primary keep','banknote','Выручка',esc(S.pts[1]),'rev2')}
    ${q('','cart','Накладная','закупка товара','buy')}
    ${q('','store','Расход магазина','аренда, бензин…','shopout')}
    ${q('','house','Расход семьи','продукты, дом…','fam')}
    ${q('','swap','Забрала домой','из магазина','home')}
  </div>`;

  return `${quick}
  <div class="bar-tools"><div class="seg flat">${PERIODS.map(([v,l])=>`<button data-act="period" data-v="${v}" class="${P===v?'on':''}">${l}</button>`).join('')}</div><span class="range">${esc(scopeLabel())} · ${rangeLabel(P)}</span></div>
  <div class="grid"><div class="stats">${stats}</div>${donut}${chart}
    <div class="row">${control}${pays}${limits}</div>
    <div class="row"><div class="w2">${recent}</div>${savings}</div>
  </div>`;
}

/* ----- строки операций ----- */
function filteredTx(scope){
  return S.tx.filter(t=>visible(t,scope)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1));
}
function opRow(t,showDate=true){
  const c=catOf(t),sc=UI.scope;
  const neutral=t.type==='tr'||t.type==='sv'||t.type==='sw';
  let sign,cls='';
  if(t.type==='tr'){sign=sc==='family'?'+':sc==='shop'?'−':'';cls=sc==='family'?'in':'tr'}
  else if(t.type==='sv'){sign='−';cls='tr'}
  else if(t.type==='sw'){sign='+';cls='tr'}
  else{sign=t.type==='in'?'+':'−';cls=t.type==='in'?'in':''}
  const tag=neutral?'':`<span class="tag">${t.space==='shop'?esc(ptName(t.pt)):'Семья'}</span>`;
  const debt=t.paid===false?'<span class="tag debt">в долг</span>':'';
  const parts=[t.cat==='purchase'&&t.sup?supName(t.sup):'',t.note,showDate?dayLabel(t.date):''].filter(Boolean);
  return `<button class="row" data-act="edit" data-id="${t.id}">
    <span class="rico ${neutral?'tr':''}">${icon(c.i,22)}</span>
    <span class="rmid"><div class="rn">${esc(c.n)}</div><div class="rs">${tag}${debt}${esc(parts.join(' · '))}</div></span>
    <span class="ra ${cls} num">${sign}${sign?' ':''}${money(t.amt)}</span></button>`;
}

/* ----- операции ----- */
function viewOps(){
  return `
  <div class="toolrow">
    <div class="search">${icon('search',20)}<input id="q" placeholder="Поиск по заметке, поставщику, категории" value="${esc(UI.q)}" autocomplete="off"></div>
    <div class="seg">${[['all','Все'],['in','Доходы'],['out','Расходы']].map(([v,l])=>`<button data-act="opstype" data-v="${v}" class="${UI.opsType===v?'on':''}">${l}</button>`).join('')}</div>
  </div>
  <div class="monthchips">${[['day','Сегодня'],['week','Неделя'],['month','Месяц'],['year','Год'],['all','Всё время']].map(([v,l])=>`<button data-act="opsperiod" data-v="${v}" class="${UI.opsPeriod===v?'on':''}">${l}</button>`).join('')}</div>
  <div id="opsList" style="display:flex;flex-direction:column;gap:18px"></div>`;
}
function renderOpsList(){
  const el=$('#opsList');if(!el)return;
  const [a,b]=range(UI.opsPeriod),A=ymd(a),B=ymd(b),q=UI.q.trim().toLowerCase();
  let list=filteredTx(UI.scope).filter(t=>t.date>=A&&t.date<=B);
  if(UI.opsType!=='all')list=list.filter(t=>t.type===UI.opsType);
  if(q)list=list.filter(t=>(t.note||'').toLowerCase().includes(q)||catOf(t).n.toLowerCase().includes(q)||(t.sup&&supName(t.sup).toLowerCase().includes(q)));
  const s=summarize(A,B,UI.scope);
  const sums=`<div class="sumrow"><div class="mini"><small>Заработано</small><b class="num" style="color:var(--g700)">${money(s.inc)}</b></div><div class="mini"><small>Потрачено</small><b class="num">${money(s.out)}</b></div><div class="mini"><small>Записей</small><b class="num">${list.length}</b></div></div>`;
  if(!list.length){el.innerHTML=sums+`<div class="card"><div class="empty"><b>Ничего не найдено</b>Попробуйте другой период или нажмите «+», чтобы добавить запись.</div></div>`;return}
  const groups={};list.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  const html=Object.keys(groups).sort().reverse().map(d=>{
    const g=groups[d];
    const net=g.reduce((n,t)=>{
      if(t.type==='tr')return UI.scope==='family'?n+t.amt:n;
      if(t.type==='sv')return n-t.amt;if(t.type==='sw')return n+t.amt;
      return n+(t.type==='in'?t.amt:-t.amt)},0);
    const dt=parse(d);
    return `<div><div class="day-h"><b>${dayLabel(d)}<span style="margin-left:8px">${DS[(dt.getDay()+6)%7]}</span></b><span class="num">${net>=0?'+':'−'}${money(Math.abs(net))}</span></div>${g.map(t=>opRow(t,false)).join('')}</div>`;
  }).join('');
  el.innerHTML=sums+`<div class="card">${html}</div>`;
}

/* ----- отчёты ----- */
function monthList(){
  const t=today(),out=[];
  for(let i=0;i<12;i++){const d=new Date(t.getFullYear(),t.getMonth()-i,1);out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
  return out;
}
const mRange=(y,mi)=>[ymd(new Date(y,mi,1)),ymd(new Date(y,mi,dim(y,mi)))];
function viewReports(){
  const sc=UI.scope,list=monthList();
  if(!UI.repMonth||!list.includes(UI.repMonth))UI.repMonth=list[0];
  const [y,m]=UI.repMonth.split('-').map(Number),mi=m-1;
  const [a,b]=mRange(y,mi);
  const c=summarize(a,b,sc);

  }
  const bySup=(sc==='family')?'':`<div class="card"><div class="card-h"><div><h3>Накладные по поставщикам</h3><p>${MN[mi]}, сколько закуплено</p></div></div>${catList(c.sup,c.purchase||1,'В этом месяце накладных нет',id=>supName(id),()=>'cart')}</div>`;

  <div class="sumrow">
    <div class="mini"><small>Заработано</small><b class="num" style="color:var(--g700)">${money(c.inc)}</b></div>
    <div class="mini"><small>Потрачено</small><b class="num">${money(c.out)}</b></div>
    <div class="mini"><small>${isShop(sc)?'Прибыль':'Осталось'}</small><b class="num">${money(c.left)}</b></div>
  </div>
  <div class="card">
    <div class="card-h"><div><h3>Последние 6 месяцев</h3><p>${esc(scopeLabel())}</p></div>
      <div class="legend"><span><i style="background:var(--g500)"></i>Заработано</span><span><i style="background:var(--g800)"></i>Потрачено</span></div></div>
    <div class="plot" style="height:240px">
      <div class="yax">${ticks.map(v=>`<span>${v?short(v):'0'}</span>`).join('')}</div>

      </div>

  </div>
  ${bySup}
  <div><button class="btn" style="width:100%" data-act="exp-csv">${icon('download',22)}Скачать все записи для Excel (CSV)</button></div>`;
}

/* ----- настройки ----- */
function viewSettings(){

/* ---------- окно записи ---------- */
const PRESETS={
  rev1:{type:'in',space:'shop',pt:1,cat:'rev'},
  rev2:{type:'in',space:'shop',pt:2,cat:'rev'},
  buy:{type:'out',space:'shop',pt:0,cat:'purchase'},
  shopout:{type:'out',space:'shop',pt:0,cat:null},
  fam:{type:'out',space:'family',pt:0,cat:null},
  home:{type:'tr',space:'shop',pt:0,cat:'tr'},
  save:{type:'sv',space:'family',pt:0,cat:'sv'}
};
function openModal(p,id){
  if(id){
    const t=S.tx.find(x=>x.id===id);if(!t)return;
    M={id,type:t.type==='sw'?'sv':t.type,sw:t.type==='sw',space:t.space,pt:t.pt||0,cat:t.cat,sup:t.sup||null,paid:t.paid!==false,amt:String(t.amt).replace('.',','),date:t.date,note:t.note||''};
  }else{
    let base=PRESETS[p]||PRESETS.rev1;
    if(p==='rev1'&&UI.scope==='family')base=PRESETS.fam;
    if(p==='rev1'&&UI.scope==='p2')base=PRESETS.rev2;
    M={id:null,sw:false,sup:null,paid:true,...base,amt:'',date:ymd(today()),note:''};
  }
  drawModal();
}
function catsFor(){return M.type==='tr'||M.type==='sv'?[]:CATS[(M.type==='in'?'in_':'out_')+M.space]}
function sellersHint(){
  const [a,b]=range('month'),A=ymd(a),B=ymd(b);
  const sc=M.pt===1?'p1':M.pt===2?'p2':'shop';
  const rev=summarize(A,B,sc).rev;
  const paid=S.tx.filter(t=>t.cat==='sellers'&&t.date>=A&&t.date<=B&&(M.pt===0||t.pt===M.pt)&&t.id!==M.id).reduce((n,t)=>n+t.amt,0);
  return Math.max(0,Math.round((rev*S.sellersPct/100-paid)/10)*10);
}
function drawModal(keep){
  const el=$('#modal');if(!M){el.innerHTML='';document.body.style.overflow='';return}
  const body=el.querySelector('.sh-body'),st=body?body.scrollTop:0;
  const tp=M.type,cats=catsFor(),t=ymd(today()),y=ymd(addDays(today(),-1));
  const shopTx=(tp==='in'||tp==='out')&&M.space==='shop';
  const ptOpts=tp==='in'?[[1,S.pts[0]],[2,S.pts[1]]]:[[0,'Общее'],[1,S.pts[0]],[2,S.pts[1]]];
  let right='';
  if(tp==='tr')right=`<div class="trinfo"><span class="qic">${icon('swap',24)}</span><span>Деньги ушли из магазина в семейный бюджет. В прибыль и расходы магазина это не считается, а в семье появится как доход «Из магазина».</span></div>`;
  else if(tp==='sv')right=`<div class="mseg s2 small"><button data-act="m-sw" data-v="0" class="${!M.sw?'on':''}">Положить</button><button data-act="m-sw" data-v="1" class="${M.sw?'on':''}">Снять</button></div>
    <div class="trinfo"><span class="qic">${icon('shield',24)}</span><span>${M.sw?'Подушка нужна, чтобы её не трогать. Снимайте только в крайнем случае.':'Откладываем и забываем. Сейчас в подушке '+money(cushionBal())+' из '+money(S.cushion.goal)+'.'}</span></div>`;
  else{
    right=`<div class="lbl">Категория</div><div class="cats">${cats.map(c=>`<button class="cat ${M.cat===c.id?'on':''}" data-act="m-cat" data-v="${c.id}"><span class="ci">${icon(c.i,22)}</span>${c.n}</button>`).join('')}</div>`;
    if(M.cat==='purchase')right+=`<div class="lbl" style="margin-top:6px">Поставщик</div><div class="chips">${S.sup.map(s=>`<button data-act="m-sup" data-v="${s.id}" class="${M.sup===s.id?'on':''}">${esc(s.n)}</button>`).join('')}</div>
      <div class="mseg s2 small"><button data-act="m-paid" data-v="1" class="${M.paid?'on':''}">Оплачено</button><button data-act="m-paid" data-v="0" class="${!M.paid?'on':''}">В долг</button></div>
      ${!M.paid?`<div class="rs" style="margin-top:-2px">Оплатить до ${(()=>{const d=addDays(parse(M.date),(supOf(M.sup)||{}).d||14);return d.getDate()+' '+MG[d.getMonth()]})()}</div>`:''}`;
    if(M.cat==='sellers'){const h=sellersHint();right+=`<button class="btn" data-act="m-sugg" data-v="${h}">Подставить начисленные ${S.sellersPct}%: ${money(h)}</button>`}
  }
  el.innerHTML=`
  <div class="ov"><div class="sheet" role="dialog" aria-modal="true">
    <div class="sh-head"><h3>${M.id?'Изменить запись':'Новая запись'}</h3><button class="xbtn" data-act="close" aria-label="Закрыть">${icon('x',22,2)}</button></div>
    <div class="sh-body">
      <div class="sh-left">
        <div class="mseg s4">${[['out','Расход'],['in','Доход'],['tr','Домой'],['sv','Копилка']].map(([v,l])=>`<button data-act="m-type" data-v="${v}" class="${tp===v?'on':''}">${l}</button>`).join('')}</div>
        ${tp==='tr'||tp==='sv'?'':`<div class="mseg s2 small">${[['shop','Магазин'],['family','Семья']].map(([v,l])=>`<button data-act="m-space" data-v="${v}" class="${M.space===v?'on':''}">${l}</button>`).join('')}</div>`}
        ${shopTx?`<div class="mseg small" style="grid-template-columns:repeat(${ptOpts.length},1fr)">${ptOpts.map(([v,l])=>`<button data-act="m-pt" data-v="${v}" class="${M.pt===v?'on':''}">${esc(l)}</button>`).join('')}</div>`:''}
        <div class="amt"><span class="v num" id="amtV"></span><span class="c">${esc(S.cur)}</span></div>
        <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-v="${n}">${n}</button>`).join('')}<button data-act="key" data-v=",">,</button><button data-act="key" data-v="0">0</button><button class="del" data-act="key" data-v="del" aria-label="Стереть">${icon('back',28,1.8)}</button></div>
      </div>
      <div class="sh-right">
        ${right}
        <div class="lbl" style="margin-top:6px">Дата</div>
        <div class="dates"><button data-act="m-date" data-v="${t}" class="${M.date===t?'on':''}">Сегодня</button><button data-act="m-date" data-v="${y}" class="${M.date===y?'on':''}">Вчера</button><label class="${M.date!==t&&M.date!==y?'on':''}">${icon('calendar',18)}<input type="date" id="dateIn" value="${M.date}" max="${t}"></label></div>
        <div class="lbl" style="margin-top:6px">Заметка</div>
        <input class="inp" id="noteIn" placeholder="${tp==='tr'?'Например: на карту':tp==='in'?'Необязательно':'Что купили, у кого'}" value="${esc(M.note)}" maxlength="80" autocomplete="off">
      </div>
    </div>
    <div class="sh-foot">${M.id?`<button class="delbtn" data-act="m-del" aria-label="Удалить">${icon('trash',24)}</button>`:''}<button class="cta" id="saveBtn" data-act="m-save">Записать</button></div>
  </div></div>`;
  document.body.style.overflow='hidden';
  const nb=el.querySelector('.sh-body');if(nb&&keep)nb.scrollTop=st;
  updAmt();
}
function typed(){
  const [i,d]=M.amt.split(',');
  const g=(i||'0').replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return d!==undefined?g+','+d:g;
}
const num=()=>parseFloat((M.amt||'0').replace(',','.'))||0;
function whyNot(){
  if(!(num()>0))return 'Введите сумму';
  if(M.type==='in'||M.type==='out'){
    if(!M.cat)return 'Выберите категорию';
    if(M.space==='shop'&&M.type==='in'&&!(M.pt>0))return 'Выберите точку';
    if(M.cat==='purchase'&&!M.sup)return 'Выберите поставщика';
  }
  return '';
}
function updAmt(){
  const v=$('#amtV');if(!v)return;
  v.textContent=typed();v.classList.toggle('zero',!M.amt||M.amt==='0');
  const w=whyNot(),btn=$('#saveBtn');
  btn.disabled=!!w;btn.textContent=w||'Записать';
}
function key(k){
  if(k==='del')M.amt=M.amt.slice(0,-1);
  else if(k===','){if(!M.amt)M.amt='0';if(!M.amt.includes(','))M.amt+=','}
  else{
    const [i,d]=M.amt.split(',');
    if(d!==undefined){if(d.length>=2)return}
    else if((i||'').length>=9)return;
    M.amt=(M.amt==='0'?'':M.amt)+k;
  }
  updAmt();
}
function normType(){
  // при смене типа/раздела подбираем допустимые значения
  if(M.type==='tr'||M.type==='sv'){M.cat=M.type;M.space=M.type==='tr'?'shop':'family';M.pt=0;return}
  const c=catsFor();
  if(!c.some(x=>x.id===M.cat))M.cat=(M.type==='in'&&M.space==='shop')?'rev':null;
  if(M.space==='family')M.pt=0;
  else if(M.type==='in'&&!(M.pt>0))M.pt=1;
  if(M.cat!=='purchase'){M.sup=null;M.paid=true}
}
function doSave(){
  const n=num(),w=whyNot();if(w)return;
  const tp=M.type==='sv'?(M.sw?'sw':'sv'):M.type;
  const rec={type:tp,space:M.space,pt:(tp==='in'||tp==='out')&&M.space==='shop'?M.pt:0,cat:tp==='sw'?'sw':M.cat,amt:Math.round(n*100)/100,date:M.date,note:($('#noteIn')?.value??M.note).trim()};
  if(tp==='out'&&M.cat==='purchase'){rec.sup=M.sup;rec.paid=M.paid;if(!M.paid)rec.due=ymd(addDays(parse(M.date),(supOf(M.sup)||{}).d||14))}
  let msg,tx;
  if(M.id){tx=S.tx.find(x=>x.id===M.id);for(const k of ['sup','paid','due'])delete tx[k];Object.assign(tx,rec);lastAdded=null;msg='Изменения сохранены'}
  else{tx={id:uid(),...rec};S.tx.push(tx);lastAdded=tx.id;
    const sign=tp==='in'||tp==='sw'?'+':'−';msg=`Записано · ${catOf(tx).n} ${sign}${money(tx.amt)}`}
  if(tp==='out'&&!M.id){
    const lim=S.limits[tx.cat];
    if(lim>0){
      const d=parse(tx.date),[a,b]=mRange(d.getFullYear(),d.getMonth());
      const used=S.tx.filter(x=>x.type==='out'&&x.cat===tx.cat&&x.date>=a&&x.date<=b).reduce((s,x)=>s+x.amt,0);
      if(used>lim)msg=`Лимит «${catById(tx.cat).n}» превышен на ${money(used-lim)}`;
      else if(used>=lim*.9)msg+=` · до лимита «${catById(tx.cat).n}» осталось ${money(lim-used)}`;
    }
  }
  save();M=null;drawModal();render();toast(msg,lastAdded?'Отменить':null);
}
function saveTx(){
  if(M.type==='sv'&&M.sw&&!M.id){
    ask('Снять из подушки?','Вы копите её, чтобы не трогать. Точно нужно снять?','Да, снять',()=>doSave());
    return;
  }
  doSave();
}
function toast(msg,action){
  const el=$('#toast');
  el.innerHTML=`<span>${esc(msg)}</span>${action?`<button data-act="undo">${action}</button>`:''}`;
  el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),action?6500:3000);
}
function ask(title,text,okLabel,cb,danger=true){
  const el=$('#confirm');
  el.innerHTML=`<div class="ov" style="z-index:80"><div class="cf"><h3>${title}</h3><p>${text}</p><div class="row2"><button class="btn" data-act="cf-no">Отмена</button><button class="btn ${danger?'red':'btn-dark'}" data-act="cf-yes">${okLabel}</button></div></div></div>`;
  el._cb=cb;
}
const closeAsk=()=>{const el=$('#confirm');el.innerHTML='';el._cb=null};

/* ---------- экспорт / импорт ---------- */
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportCSV(){
  const head='Дата;Тип;Раздел;Точка;Категория;Поставщик;Оплачено;Сумма;Заметка';
  const lines=S.tx.slice().sort((a,b)=>a.date<b.date?-1:1).map(t=>{
    const typ={in:'Доход',out:'Расход',tr:'Перевод домой',sv:'В подушку',sw:'Из подушки'}[t.type];
    const raz=t.type==='tr'?'Магазин → Семья':t.space==='shop'?'Магазин':'Семья';
    return [t.date,typ,raz,t.space==='shop'&&t.type!=='tr'?ptName(t.pt):'',catOf(t).n,t.sup?supName(t.sup):'',t.cat==='purchase'?(t.paid===false?'в долг':'да'):'',String(t.amt).replace('.',','),'"'+(t.note||'').replace(/"/g,'""')+'"'].join(';');
  });
  download(`finansy-${ymd(today())}.csv`,'﻿'+[head,...lines].join('\r\n'),'text/csv;charset=utf-8');
}
function exportJSON(){download(`kopiya-dannyh-${ymd(today())}.json`,JSON.stringify(S,null,1),'application/json')}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.tx))throw 0;
      const tx=d.tx.filter(t=>t&&t.id&&t.date&&['in','out','tr','sv','sw'].includes(t.type)&&typeof t.amt==='number'&&t.amt>0).map(t=>({id:String(t.id),date:String(t.date),type:t.type,space:t.space==='family'?'family':'shop',pt:[0,1,2].includes(t.pt)?t.pt:0,cat:String(t.cat||''),amt:t.amt,note:String(t.note||''),...(t.sup?{sup:String(t.sup)}:{}),...(t.paid===false?{paid:false,due:t.due?String(t.due):undefined}:{})}));
      ask('Загрузить копию?',`В копии ${tx.length} записей. Текущие записи на этом устройстве будут заменены.`,'Загрузить',()=>{
        S=Object.assign(defaults(),d,{tx,demo:false});
        save();render();toast('Копия загружена');
      },false);
    }catch(e){toast('Это не файл копии данных')}
  };
  r.readAsText(file);
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const ov=e.target.classList&&e.target.classList.contains('ov')?e.target:null;
  if(ov&&ov.closest('#modal')){M=null;drawModal();return}
  const el=e.target.closest('[data-act]');
  if(!el){hideTip();return}
  const act=el.dataset.act,v=el.dataset.v;
  switch(act){
    case 'nav':UI.view=v;UI.q='';location.hash=v;render(false);break;
    case 'scope':UI.scope=v;saveUI();render();break;
    case 'period':UI.period=v;saveUI();render();break;
    case 'opsperiod':UI.opsPeriod=v;saveUI();render();break;
    case 'opstype':UI.opsType=v;render();break;
    case 'repmonth':UI.repMonth=v;render();break;
    case 'add':openModal(el.dataset.p);break;
    case 'edit':openModal(null,el.dataset.id);break;
    case 'close':M=null;drawModal();break;
    case 'm-type':M.note=$('#noteIn')?.value??M.note;M.type=v;normType();drawModal(true);break;
    case 'm-space':M.note=$('#noteIn')?.value??M.note;M.space=v;normType();drawModal(true);break;
    case 'm-pt':M.note=$('#noteIn')?.value??M.note;M.pt=+v;drawModal(true);break;
    case 'm-cat':M.note=$('#noteIn')?.value??M.note;M.cat=v;if(v!=='purchase'){M.sup=null;M.paid=true}drawModal(true);break;
    case 'm-sup':M.note=$('#noteIn')?.value??M.note;M.sup=v;M.paid=!((supOf(v)||{}).d>0);drawModal(true);break;
    case 'm-paid':M.note=$('#noteIn')?.value??M.note;M.paid=v==='1';drawModal(true);break;
    case 'm-sw':M.note=$('#noteIn')?.value??M.note;M.sw=v==='1';drawModal(true);break;
    case 'm-sugg':M.amt=String(+v).replace('.',',');updAmt();break;
    case 'm-date':M.note=$('#noteIn')?.value??M.note;M.date=v;drawModal(true);break;
    case 'key':key(v);break;
    case 'm-save':saveTx();break;
    case 'm-del':ask('Удалить запись?','Это действие нельзя отменить.','Удалить',()=>{S.tx=S.tx.filter(x=>x.id!==M.id);save();M=null;drawModal();render();toast('Запись удалена')});break;
    case 'cf-no':closeAsk();break;
    case 'cf-yes':{const cb=$('#confirm')._cb;closeAsk();cb&&cb();break}
    case 'undo':if(lastAdded){S.tx=S.tx.filter(x=>x.id!==lastAdded);for(const k in S.rpaid)if(S.rpaid[k]===lastAdded)delete S.rpaid[k];lastAdded=null;save();render();$('#toast').classList.remove('show')}break;
    case 'pay-inv':{const t=S.tx.find(x=>x.id===el.dataset.id);if(t){t.paid=true;delete t.due;save();render();toast('Накладная оплачена')}break}
    case 'pay-rec':{
      const r=S.rec.find(x=>x.id===el.dataset.id);if(!r)break;
      const t={id:uid(),date:ymd(today()),type:'out',space:r.space,pt:r.pt||0,cat:r.cat,amt:r.amt,note:r.n};
      const d=today();S.tx.push(t);S.rpaid[r.id+':'+d.getFullYear()+'-'+pad(d.getMonth()+1)]=t.id;lastAdded=t.id;
      save();render();toast(`Оплачено · ${r.n} −${money(r.amt)}`,'Отменить');break}
    case 'add-sup':S.sup.push({id:'s'+uid(),n:'Новый поставщик',d:0});save();render();break;
    case 'del-sup':ask('Удалить поставщика?','Накладные с ним останутся в записях.','Удалить',()=>{S.sup=S.sup.filter(s=>s.id!==el.dataset.id);save();render()});break;
    case 'add-rec':S.rec.push({id:'r'+uid(),n:'Новый платёж',amt:0,space:'shop',pt:0,cat:'s_other',per:'m',day:null,mon:null});save();render();break;
    case 'del-rec':ask('Удалить платёж?','Он пропадёт из напоминаний. Уже записанные оплаты останутся.','Удалить',()=>{S.rec=S.rec.filter(r=>r.id!==el.dataset.id);save();render()});break;
    case 'exp-csv':exportCSV();break;
    case 'exp-json':exportJSON();break;
    case 'imp-json':$('#file').click();break;
    case 'demo-clear':ask('Начать с чистого листа?','Пример данных будет удалён. Поставщики, платежи, лимиты и настройки останутся.','Начать с нуля',()=>{S.tx=[];S.rpaid={};S.demo=false;save();render(false);toast('Всё чисто. Можно записывать')},false);break;
    case 'demo-load':ask('Показать пример?','Текущие записи будут заменены примером данных.','Показать',()=>{S.tx=genDemo();S.rpaid={};S.demo=true;save();render()},false);break;
    case 'wipe':ask('Удалить все записи?','Все операции будут удалены с этого устройства. Поставщики, платежи, лимиты и настройки останутся.','Удалить всё',()=>{S.tx=[];S.rpaid={};S.demo=false;save();render();toast('Записи удалены')});break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){UI.q=e.target.value;renderOpsList()}
  else if(e.target.id==='noteIn'&&M)M.note=e.target.value;
});
const numVal=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='dateIn'&&M&&t.value){M.note=$('#noteIn')?.value??M.note;M.date=t.value;drawModal(true)}
  else if(t.id==='storeName'){S.name=t.value.trim()||'Райский уголок';save();render()}
  else if(t.id==='sellersPct'){const n=numVal(t.value);S.sellersPct=n>=0&&n<=100?n:2;t.value=S.sellersPct;save()}
  else if(d.pt!==undefined){S.pts[+d.pt]=t.value.trim()||('Точка '+(+d.pt+1));save();render()}
  else if(d.cu){S.cushion[d.cu]=Math.max(d.cu==='months'?1:0,Math.round(numVal(t.value)));t.value=S.cushion[d.cu];save()}
  else if(d.lim){const n=numVal(t.value);if(n>0)S.limits[d.lim]=n;else delete S.limits[d.lim];save();t.value=S.limits[d.lim]||''}
  else if(d.sup){const s=S.sup.find(x=>x.id===d.sup);if(s){if(d.k==='n')s.n=t.value.trim()||'Поставщик';else s.d=+t.value;save()}}
  else if(d.rec){
    const r=S.rec.find(x=>x.id===d.rec);if(!r)return;
    if(d.k==='n')r.n=t.value.trim()||'Платёж';
    else if(d.k==='amt')r.amt=Math.max(0,numVal(t.value));
    else if(d.k==='day'){const n=Math.round(numVal(t.value));r.day=n>=1&&n<=31?n:null;t.value=r.day||''}
    else if(d.k==='per'){r.per=t.value;if(r.per==='m')r.mon=null;save();render();return}
    else if(d.k==='mon')r.mon=t.value?+t.value:null;
    save();
  }
  else if(t.id==='file'&&t.files[0]){importJSON(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(M){
    const inInput=e.target.tagName==='INPUT';
    if(e.key==='Escape'){M=null;drawModal();return}
    if(inInput&&e.target.id==='noteIn'&&e.key==='Enter'){e.preventDefault();saveTx();return}
    if(inInput)return;
    if(/^[0-9]$/.test(e.key))key(e.key);
    else if(e.key===','||e.key==='.')key(',');
    else if(e.key==='Backspace')key('del');
    else if(e.key==='Enter'){e.preventDefault();saveTx()}
  }else if(e.key==='Escape')closeAsk();
});
/* подсказка над столбцами */
const tipEl=$('#tip');
function showTip(col){
  const [l,i,o]=col.dataset.tip.split('|');
  tipEl.innerHTML=`<b>${esc(l)}</b><br><i style="background:var(--g500)"></i>Заработано ${money(+i)}<br><i style="background:#fff"></i>Потрачено ${money(+o)}`;
  tipEl.style.display='block';
  const r=col.getBoundingClientRect(),w=tipEl.offsetWidth;
  tipEl.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+'px';
  tipEl.style.top=Math.max(8,r.top-tipEl.offsetHeight-6)+'px';
}
const hideTip=()=>{tipEl.style.display='none'};
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('.col[data-tip]');c?showTip(c):hideTip()});
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.col[data-tip]');if(c)showTip(c)},true);
window.addEventListener('scroll',hideTip,{passive:true});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['home','ops','reports','settings'].includes(v)&&v!==UI.view){UI.view=v;render(false)}});

(function init(){
  const v=location.hash.slice(1);
  if(['home','ops','reports','settings'].includes(v))UI.view=v;
  render(false);
})();
</script>
</body>
